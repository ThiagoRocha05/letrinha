<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF6B6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letrinha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Letrinha 🌟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --coral:    #FF6B6B;
    --yellow:   #FFE66D;
    --teal:     #4ECDC4;
    --purple:   #A855F7;
    --blue:     #60A5FA;
    --green:    #4ADE80;
    --orange:   #FB923C;
    --pink:     #F472B6;
    --dark:     #1E1B4B;
    --card:     #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Animated background blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.25;
    animation: blobFloat 8s ease-in-out infinite;
    pointer-events: none;
  }
  .blob1 { width: 400px; height: 400px; background: var(--coral);  top: -100px; left: -100px; animation-delay: 0s; }
  .blob2 { width: 300px; height: 300px; background: var(--teal);   bottom: -80px; right: -80px; animation-delay: -3s; }
  .blob3 { width: 250px; height: 250px; background: var(--purple); top: 40%; left: 50%; animation-delay: -5s; }
  @keyframes blobFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(30px,-20px) scale(1.05); }
    66%      { transform: translate(-20px,30px) scale(0.95); }
  }

  /* Stars bg */
  .star-field {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden;
  }
  .star {
    position: absolute;
    width: 4px; height: 4px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(1); }
    50%      { opacity: 0.7; transform: scale(1.5); }
  }

  /* ====== SCREENS ====== */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    transition: opacity 0.4s, transform 0.4s;
    z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }

  /* ====== HOME SCREEN ====== */
  #home {
    gap: 24px;
  }
  .logo-wrap {
    text-align: center;
    animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .logo-emoji { font-size: clamp(80px, 18vw, 130px); display: block; animation: wiggle 2s ease-in-out infinite; }
  @keyframes wiggle {
    0%,100% { transform: rotate(-5deg) scale(1); }
    50%      { transform: rotate(5deg) scale(1.05); }
  }
  .logo-title {
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(52px, 14vw, 96px);
    background: linear-gradient(135deg, var(--yellow), var(--coral), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(255,107,107,0.4));
  }
  .logo-sub {
    color: rgba(255,255,255,0.7);
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 700;
    margin-top: 4px;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    to   { opacity: 1; transform: scale(1) rotate(0); }
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--dark);
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(24px, 6vw, 36px);
    padding: 18px 60px;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 12px 30px rgba(255,140,0,0.4);
    transform: translateY(0);
    transition: all 0.1s;
    animation: popIn 0.6s 0.3s cubic-bezier(.34,1.56,.64,1) both;
    position: relative;
    overflow: hidden;
  }
  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
    border-radius: inherit;
  }
  .btn-primary:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 6px 15px rgba(255,140,0,0.4);
  }

  .phase-select {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    animation: popIn 0.6s 0.5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .phase-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    color: white;
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(14px, 3.5vw, 18px);
    padding: 10px 20px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .phase-btn:hover, .phase-btn.active {
    background: rgba(255,255,255,0.2);
    border-color: var(--yellow);
    color: var(--yellow);
    transform: scale(1.05);
  }

  /* ====== GAME SCREEN ====== */
  #game {
    gap: 0;
    padding: 0;
    justify-content: flex-start;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .hud {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 0;
    flex-shrink: 0;
  }
  .hud-home-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hud-home-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.9); }
  .hud-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .hud-home-btn.small { width: 36px; height: 36px; font-size: 17px; }

  .speak-btn {
    background: rgba(78,205,196,0.18);
    border: 2px solid rgba(78,205,196,0.4);
    color: var(--teal);
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(13px, 3.2vw, 16px);
    padding: 6px 16px;
    border-radius: 50px;
    cursor: pointer;
    margin: 6px auto 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .speak-btn:active { transform: scale(0.94); background: rgba(78,205,196,0.3); }

  /* Exit confirm overlay */
  #exitConfirm {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  #exitConfirm.visible { opacity: 1; pointer-events: all; }
  .exit-card {
    background: white;
    border-radius: 28px;
    padding: 36px 40px;
    text-align: center;
    max-width: 340px; width: 90%;
    animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .exit-card .exit-emoji { font-size: 60px; display: block; margin-bottom: 8px; }
  .exit-card h2 {
    font-family: 'ABeeZee', sans-serif;
    font-size: 28px; color: #1E1B4B;
    margin-bottom: 6px;
  }
  .exit-card p { color: #666; font-size: 16px; font-weight: 700; margin-bottom: 24px; }
  .exit-btns { display: flex; gap: 12px; }
  .exit-btn-yes {
    flex: 1; padding: 14px;
    background: linear-gradient(135deg, var(--coral), #ff4444);
    color: white; font-family: 'ABeeZee', sans-serif;
    font-size: 20px; border: none; border-radius: 16px;
    cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    transition: all 0.1s;
  }
  .exit-btn-yes:active { transform: translateY(3px); box-shadow: none; }
  .exit-btn-no {
    flex: 1; padding: 14px;
    background: linear-gradient(135deg, var(--green), var(--teal));
    color: white; font-family: 'ABeeZee', sans-serif;
    font-size: 20px; border: none; border-radius: 16px;
    cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    transition: all 0.1s;
  }
  .exit-btn-no:active { transform: translateY(3px); box-shadow: none; }
  .hud-stars {
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    color: var(--yellow);
    display: flex; align-items: center; gap: 6px;
  }
  .hud-level {
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(14px, 3.5vw, 18px);
    color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.1);
    padding: 6px 16px;
    border-radius: 50px;
  }
  .hud-lives { display: flex; gap: 4px; font-size: clamp(20px, 5vw, 26px); }

  .progress-bar-wrap {
    width: 100%;
    padding: 8px 16px;
    flex-shrink: 0;
  }
  .progress-bar {
    height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    border-radius: 10px;
    transition: width 0.5s ease;
    box-shadow: 0 0 10px rgba(78,205,196,0.6);
  }

  .game-area {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 8px 16px 16px;
    gap: 12px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  /* Question card */
  .question-card {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 16px 20px;
    width: 100%;
    text-align: center;
    position: relative;
    flex-shrink: 0;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .theme-emoji {
    font-size: clamp(44px, 11vw, 72px);
    display: block;
    margin-bottom: 6px;
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .question-label {
    color: rgba(255,255,255,0.6);
    font-size: clamp(13px, 3vw, 16px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  /* Word display with blanks */
  .word-display {
    display: flex; gap: clamp(4px, 1.5vw, 10px);
    align-items: center; justify-content: center;
    flex-wrap: nowrap;
    flex-shrink: 1;
    width: 100%;
    margin: 8px 0;
    overflow: visible;
  }

  .letter-box {
    width: clamp(32px, 9vw, 62px);
    height: clamp(36px, 10vw, 68px);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: clamp(18px, 5.5vw, 40px);
    flex-shrink: 1;
    position: relative;
    transition: transform 0.2s;
  }
  .letter-box.filled {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .letter-box.blank {
    background: rgba(255,255,255,0.05);
    border: 3px dashed rgba(255,255,255,0.35);
    color: transparent;
    cursor: default;
  }
  .letter-box.blank.answer-placed {
    background: rgba(78,205,196,0.2);
    border: 3px solid var(--teal);
    color: var(--teal);
    animation: placePop 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .letter-box.correct-flash {
    animation: correctFlash 0.5s ease forwards;
  }
  .letter-box.wrong-flash {
    animation: wrongFlash 0.4s ease forwards;
  }
  @keyframes placePop {
    from { transform: scale(0.7); }
    to   { transform: scale(1); }
  }
  @keyframes correctFlash {
    0%   { background: rgba(74,222,128,0.3); border-color: var(--green); color: var(--green); transform: scale(1.1); }
    100% { background: rgba(74,222,128,0.15); transform: scale(1); }
  }
  @keyframes wrongFlash {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-8px); background: rgba(255,107,107,0.3); border-color: var(--coral); }
    75%     { transform: translateX(8px); }
  }

  /* Syllable boxes are wider */
  .syllable-box {
    min-width: clamp(48px, 13vw, 90px);
    height: clamp(44px, 11vw, 70px);
    padding: 0 8px;
    font-size: clamp(16px, 4.5vw, 28px);
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    border-radius: 14px;
    flex-shrink: 1;
  }

  /* Options row */
  .options-grid {
    display: flex; gap: clamp(8px, 2.5vw, 14px);
    flex-wrap: wrap; justify-content: center;
    width: 100%;
    flex-shrink: 0;
  }

  .option-btn {
    min-width: clamp(46px, 11vw, 68px);
    height: clamp(46px, 11vw, 68px);
    border-radius: 16px;
    border: 3px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: white;
    font-family: 'ABeeZee', sans-serif;
    font-weight: 900;
    font-size: clamp(18px, 5vw, 32px);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    padding: 0 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .option-btn:active, .option-btn.selected {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    background: rgba(255,255,255,0.2);
    border-color: var(--yellow);
    color: var(--yellow);
  }
  .option-btn.used {
    opacity: 0.3;
    pointer-events: none;
    transform: scale(0.9);
  }

  /* options-area wraps grid + action buttons */
  .options-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  /* For build-word mode: target word display */
  .build-target {
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(13px, 3.5vw, 18px);
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: -4px;
  }

  /* Action buttons */
  .action-row {
    display: flex; gap: 12px; width: 100%; justify-content: center;
    flex-shrink: 0;
  }
  .btn-check {
    background: linear-gradient(135deg, var(--green), var(--teal));
    color: var(--dark);
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(16px, 4vw, 22px);
    padding: 13px 36px;
    border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    transition: all 0.1s;
    flex: 1; max-width: 240px;
  }
  .btn-check:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .btn-check:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-clear {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(16px, 4vw, 22px);
    padding: 13px 20px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50px; cursor: pointer;
    transition: all 0.1s;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2);
  }
  .btn-clear:active { transform: translateY(4px); box-shadow: none; }

  /* ====== FEEDBACK OVERLAY ====== */
  #feedback {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
  }
  .feedback-card {
    background: white;
    border-radius: 32px;
    padding: 40px 48px;
    text-align: center;
    max-width: 380px; width: 90%;
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .feedback-emoji { font-size: 80px; display: block; margin-bottom: 12px; }
  .feedback-title {
    font-family: 'ABeeZee', sans-serif;
    font-size: 36px;
    margin-bottom: 8px;
  }
  .feedback-title.win  { color: var(--green); }
  .feedback-title.lose { color: var(--coral); }
  .feedback-sub { color: #666; font-size: 18px; font-weight: 700; margin-bottom: 24px; }
  .stars-row { font-size: 42px; margin-bottom: 24px; }

  /* ====== RESULT SCREEN ====== */
  #result { gap: 20px; }
  .result-card {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 40px;
    text-align: center;
    max-width: 460px; width: 100%;
    animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .result-emoji { font-size: 90px; display: block; margin-bottom: 8px; }
  .result-title {
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(36px, 9vw, 56px);
    background: linear-gradient(135deg, var(--yellow), var(--coral));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-score {
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(18px, 5vw, 26px);
    color: white; margin: 12px 0 8px;
  }
  .result-stars { font-size: 48px; }
  .result-next-btn {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: white;
    font-family: 'ABeeZee', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    padding: 16px 48px;
    border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    margin-top: 8px;
    transition: all 0.1s;
  }
  .result-next-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }

  /* Floating particles */
  .particle {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    animation: particleFly 1.2s ease-out forwards;
    z-index: 100;
  }
  @keyframes particleFly {
    from { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    to   { opacity: 0; transform: translateY(-200px) rotate(360deg) scale(0.3); }
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 12px; height: 12px;
    pointer-events: none;
    z-index: 100;
    animation: confettiFall 2s ease-in forwards;
  }
  @keyframes confettiFall {
    from { opacity: 1; transform: translateY(-50px) rotate(0deg); }
    to   { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  /* Shake animation for the card */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-12px); }
    40%,80% { transform: translateX(12px); }
  }
  .shake { animation: shake 0.4s ease; }

  .mode-choose { background: rgba(251,146,60,0.3); color: #FED7AA; border: 1px solid rgba(251,146,60,0.4); }

  /* Phase 4 choose-word options */
  .choose-grid {
    display: flex; flex-direction: column; gap: clamp(10px, 2.5vw, 16px);
    width: 100%;
  }
  .choose-btn {
    width: 100%;
    padding: clamp(16px, 4vw, 22px) 20px;
    border-radius: 20px;
    border: 3px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white;
    font-family: 'ABeeZee', sans-serif;
    font-style: normal;
    font-size: clamp(22px, 6vw, 34px);
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25);
    text-align: center;
    letter-spacing: 2px;
  }
  .choose-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
  .choose-btn.correct-choice {
    background: rgba(74,222,128,0.3);
    border-color: var(--green);
    color: var(--green);
    animation: correctFlash 0.5s ease forwards;
  }
  .choose-btn.wrong-choice {
    background: rgba(255,107,107,0.25);
    border-color: var(--coral);
    color: var(--coral);
    pointer-events: none;
    animation: wrongFlash 0.4s ease forwards;
  }
  .choose-btn.disabled { pointer-events: none; opacity: 0.4; }
  .mode-tag {
    display: inline-block;
    font-size: clamp(11px, 2.5vw, 13px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 50px;
    margin-bottom: 10px;
  }

// Muitos mecanismos de TTS (Chrome, Android, Windows) tratam palavras curtas
// TODAS EM MAIÚSCULAS como siglas e as soletram letra por letra (ex: "HEN" -> "H E N").
// Normalizamos para Primeira maiúscula + resto minúsculo, que é lido como palavra normal.
// Letras avulsas (1 caractere) ficam intactas de propósito: ali queremos o nome da letra.
function naturalCase(text) {
  if (!text || text.length <= 1) return text;
  return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
}

let __voicesCache = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  __voicesCache = window.speechSynthesis.getVoices();
  if (!__voicesCache.length) {
    window.speechSynthesis.onvoiceschanged = () => { __voicesCache = window.speechSynthesis.getVoices(); };
  }
}

// Setar só a string de idioma (u.lang) nem sempre troca a voz de verdade em todo navegador.
// Aqui procuramos uma voz instalada que bata com o idioma pedido; se não achar, cai no padrão do sistema.
function pickVoice(lang) {
  if (!__voicesCache.length) __voicesCache = window.speechSynthesis.getVoices();
  const prefix = lang.split('-')[0];
  return __voicesCache.find(v => v.lang === lang)
      || __voicesCache.find(v => v.lang && v.lang.startsWith(prefix))
      || null;
}

function speak(text, opts = {}) {
  const { lang = 'pt-BR', rate = 0.85, force = false } = opts;
  if (!force && !soundOn) return;
  if (!('speechSynthesis' in window)) return;
  try {
    const ss = window.speechSynthesis;
    ss.cancel();
    const token = (window.__spTok = (window.__spTok || 0) + 1);
    // Chrome/Android perdem a fala se speak() vier colado no cancel(); um respiro curto resolve.
    setTimeout(() => {
      if (token !== window.__spTok) return;
      try {
        const u = new SpeechSynthesisUtterance(naturalCase(text));
        const voice = pickVoice(lang);
        if (voice) u.voice = voice;
        u.lang = voice ? voice.lang : lang;
        u.rate = rate;
        u.pitch = 1.05;
        window.__spLast = u; // evita coleta de lixo antes do fim da fala
        if (ss.paused) ss.resume();
        ss.speak(u);
      } catch (e) {}
    }, 70);
  } catch (e) { /* navegador sem suporte */ }
}

function speakCurrentWord(force = false) {
  if (!currentData) return;
  if (currentMode === 'trace') { speak(`${currentData.word} de ${currentData.ex}`, { force, rate: 0.8 }); return; }
  if (currentMode === 'choose') {
    speak(currentData.hint || 'What is this?', { lang: 'en-US', rate: 0.85, force });
  } else {
    speak(currentData.word, { lang: 'pt-BR', rate: 0.8, force });
  }
}

function primeAudio() {
  // Destrava SpeechSynthesis e AudioContext no iOS/Safari; precisa rodar dentro de um gesto do usuário.
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    }
  } catch (e) {}
  getAudioCtx();
}

function getAudioCtx() {
  if (!window.__audioCtx) {
    try { window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (window.__audioCtx.state === 'suspended') window.__audioCtx.resume().catch(()=>{});
  return window.__audioCtx;
}

function playChime(correct) {
  if (!soundOn) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  try {
    if (correct) {
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain); gain.connect(ctx.destination);
        const t = now + i * 0.09;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        osc.start(t); osc.stop(t + 0.3);
      });
    } else {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 180;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    }
  } catch (e) {}
}

function vibrateFeedback(pattern) {
  if (soundOn && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}

function loadQuestion() {
  const phaseData = PHASES[currentPhase];
  if(currentQ >= phaseData.questions || lives <= 0) {
    showResult(); return;
  }

  currentData = shuffledWords[currentQ];
  qWrong = false;

    `${phaseData.name.split('·')[0].trim()} · Q${currentQ+1}/${phaseData.questions}`;

  const pct = (currentQ/phaseData.questions)*100;
  document.getElementById('wordDisplay').innerHTML = '';
  document.getElementById('progressFill').style.width = pct+'%';

  // Emoji + hint
  document.getElementById('themeEmoji').textContent = currentData.emoji;
  document.getElementById('questionLabel').textContent = currentMode === 'choose'

  const modeTag = document.getElementById('modeTag');
  const buildTarget = document.getElementById('buildTarget');
  buildTarget.classList.add('hidden');

  if(currentMode === 'letter') {
    modeTag.className = 'mode-tag mode-letter';
    modeTag.textContent = '🔤 Letra que falta';
    buildLetterMode();
  } else if(currentMode === 'syllable') {
    modeTag.className = 'mode-tag mode-syllable';
    modeTag.textContent = '✏️ Sílaba que falta';
    buildSyllableMode();
  } else if(currentMode === 'choose') {
    modeTag.className = 'mode-tag mode-choose';
    modeTag.textContent = '👀 Qual é a palavra?';
    buildChooseMode();
  } else if(currentMode === 'trace') {
    modeTag.className = 'mode-tag mode-build';
    modeTag.textContent = '✏️ Escreva a letra';
    buildTraceMode();
  } else if(currentMode === 'listen') {
    modeTag.className = 'mode-tag mode-syllable';
    modeTag.textContent = '👂 Ouça e ache';
    buildListenMode();
  } else if(currentMode === 'initial') {
    modeTag.className = 'mode-tag mode-letter';
    modeTag.textContent = '🔠 Primeira letra';
    buildInitialMode();
  } else {
    modeTag.className = 'mode-tag mode-build';
    modeTag.textContent = '🔀 Monte a palavra';
    buildBuildMode();
  }

  document.getElementById('checkBtn').disabled = true;
  clearTimeout(window.__speakTimer);
  window.__speakTimer = setTimeout(() => speakCurrentWord(), 400);
}

// ---- LETTER MODE ----
function buildLetterMode() {
  const word = currentData.word;
  // How many blanks? Phase-based
  const numBlanks = currentPhase === 1 ? 1 : currentPhase === 2 ? 2 : 3;
  const available = [];
  for(let i=0;i<word.length;i++) available.push(i);
  blankIdxs = shuffle(available).slice(0, Math.min(numBlanks, word.length-1)).sort((a,b)=>a-b);
  answers = new Array(blankIdxs.length).fill('');

  // Word display
  const wd = document.getElementById('wordDisplay');
  wd.innerHTML = '';
  for(let i=0;i<word.length;i++){
    const box = document.createElement('div');
    box.className = blankIdxs.includes(i) ? 'letter-box blank' : 'letter-box filled';
    box.textContent = blankIdxs.includes(i) ? '' : word[i];
    if(blankIdxs.includes(i)){
      box.dataset.blankOrder = blankIdxs.indexOf(i);
      box.id = 'blank_'+blankIdxs.indexOf(i);
    }
    wd.appendChild(box);
  }

  // Generate options: correct letters + distractors
  const correctLetters = blankIdxs.map(i=>word[i]);
  const distractors = generateLetterDistractors(correctLetters, word);
  const allOptions = shuffle([...correctLetters, ...distractors]);

  renderOptions(allOptions, 'letter');
}

function generateLetterDistractors(correct, word) {
  const used = new Set([...correct, ...word.split('')]);
  const pool = 'ABCDEFGHIJKLMNOPRSTUVZ'.split('').filter(l=>!used.has(l));
  const count = Math.min(4, pool.length);
  return shuffle(pool).slice(0, count);
}

// ---- SYLLABLE MODE ----
function buildSyllableMode() {
  const word = currentData.word;
  const sylls = SYLLABLE_MAP[word] || splitSyllablesFallback(word);
  if(sylls.length < 2) { currentMode='letter'; buildLetterMode(); return; }

  // Pick 1 blank syllable slot
  const blankPos = Math.floor(Math.random()*sylls.length);
  blankIdxs = [blankPos];
  answers = [''];
  blanks = [sylls[blankPos]];

  const wd = document.getElementById('wordDisplay');
  wd.innerHTML = '';
  for(let i=0;i<sylls.length;i++){
    const box = document.createElement('div');
    box.className = (i===blankPos) ? 'letter-box syllable-box blank' : 'letter-box syllable-box filled';
    box.textContent = (i===blankPos) ? '' : sylls[i];
    if(i===blankPos) { box.id='blank_0'; box.dataset.blankOrder=0; }
    wd.appendChild(box);
  }

  // Options: correct syllable + distractors
  const distractors = generateSyllableDistractors(sylls[blankPos], sylls, word);
  const allOptions = shuffle([sylls[blankPos], ...distractors]);
  renderOptions(allOptions, 'syllable');
}

function generateSyllableDistractors(correct, sylls, word) {
  // Pull from other words' syllables
  const allSylls = Object.values(SYLLABLE_MAP).flat().filter(s=>s!==correct && !sylls.includes(s));
  return shuffle(allSylls).slice(0,3);
}

function splitSyllablesFallback(word) {
  // Simple: split into pairs
  const parts = [];
  for(let i=0;i<word.length;i+=2) parts.push(word.slice(i,i+2));
  return parts;
}

// ---- CHOOSE MODE (Fase 4) ----
function buildChooseMode() {
  document.getElementById('wordDisplay').innerHTML = '';
  document.getElementById('optionsGrid').innerHTML = '';
  document.querySelector('.action-row').style.display = 'none';

  // Pick 2 wrong options from the same phase pool (using English)
  const pool = PHASES[4].words.filter(w => w.eng !== currentData.eng);
  const wrongs = shuffle([...pool]).slice(0, 2).map(w => w.eng);
  const options = shuffle([currentData.eng, ...wrongs]);

  const grid = document.getElementById('optionsGrid');
  grid.className = 'choose-grid';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choose-btn';
    btn.textContent = opt;
    btn.onclick = () => pickChooseOption(btn, opt);
    grid.appendChild(btn);
  });
}

function pickChooseOption(btn, value) {
  // Disable all buttons immediately
  document.querySelectorAll('.choose-btn').forEach(b => b.classList.add('disabled'));

  const correct = value === currentData.eng;
  btn.classList.remove('disabled');
  btn.classList.add(correct ? 'correct-choice' : 'wrong-choice');

  if(!correct) {
    // Highlight the correct answer
    document.querySelectorAll('.choose-btn').forEach(b => {
      if(b.textContent === currentData.eng) b.classList.add('correct-choice');
    });
    loseLife();
    playChime(false);
    vibrateFeedback([50,40,50]);
  }

  if(correct) {
    const ptsE = awardCorrect(8);
    if(P()) P().engOk++;
    spawnParticles(true);
    playChime(true);
    vibrateFeedback([30]);
    setTimeout(() => {
      speak(currentData.eng, { lang: 'en-US', rate: 0.85 });
      showFeedback(true, ptsE, false);
    }, 700);
  } else if(lives <= 0) {
    // Game over
    setTimeout(() => {
      showFeedback(false, 0, true);
    }, 1200);
  } else {
    // Wrong but still has lives: show correct answer briefly then auto-advance
    setTimeout(() => {
      currentQ++;
      showScreen('game');
      loadQuestion();
    }, 1500);
  }
}

// ---- BUILD MODE ----
function buildBuildMode() {
  const word = currentData.word;
  const sylls = SYLLABLE_MAP[word] || splitSyllablesFallback(word);

  // All syllables are blanks; options are shuffled syllables
  blankIdxs = sylls.map((_,i)=>i);
  answers = new Array(sylls.length).fill('');
  blanks  = [...sylls];

  const buildTarget = document.getElementById('buildTarget');
  buildTarget.classList.add('hidden');

  const wd = document.getElementById('wordDisplay');
  wd.innerHTML = '';
  for(let i=0;i<sylls.length;i++){
    const box = document.createElement('div');
    box.className = 'letter-box syllable-box blank';
    box.id = 'blank_'+i;
    box.dataset.blankOrder = i;
    wd.appendChild(box);
  }

  const shuffledSylls = shuffle([...sylls]);
  renderOptions(shuffledSylls, 'build');
}

// ---- RENDER OPTIONS ----
function renderOptions(options, mode) {
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  options.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.dataset.value = opt;
    btn.dataset.idx = idx;
    btn.onclick = () => pickOption(btn, mode);
    grid.appendChild(btn);
  });
}

// ---- PICK OPTION ----
function pickOption(btn, mode) {
  if(btn.classList.contains('used')) return;

  const value = btn.dataset.value;
  // Só falamos em voz alta no modo LETRA (nome de letra é bem definido: "bê", "cê"...).
  // No modo sílaba/monte-a-palavra NUNCA falamos a opção isolada, nem quando ela tem
  // 1 caractere só (existe sílaba de uma letra em português, tipo o "O" de PRÉDIO) —
  // o critério certo é o modo da pergunta, não o tamanho do texto. Sílaba isolada é
  // ambígua fora do contexto da palavra e, sem voz em português instalada, acaba caindo
  // numa voz em inglês que soletra tudo. A palavra inteira já é falada certinho ao
  // carregar a pergunta e pelo botão "Ouvir".
  if (mode === 'letter') speak(value, { rate: 0.75 });

  if(mode === 'build' || mode === 'letter') {
    // Fill next empty slot sequentially
    const nextEmpty = answers.findIndex(a=>a==='');
    if(nextEmpty === -1) return;
    answers[nextEmpty] = value;
    updateBlankDisplay(nextEmpty, value);
    btn.classList.add('used');
  } else {
    // Syllable mode: single blank, allow swap
    if(answers[0] !== '') {
      // Clear previous selection
      const prev = document.querySelector('.option-btn.selected');
      if(prev) { prev.classList.remove('selected','used'); }
    }
    answers[0] = value;
    updateBlankDisplay(0, value);
    document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  // Enable check if all blanks filled
  const allFilled = answers.every(a=>a!=='');
  document.getElementById('checkBtn').disabled = !allFilled;
}

function updateBlankDisplay(idx, value) {
  const box = document.getElementById('blank_'+idx);
  if(!box) return;
  box.textContent = value;
  box.classList.add('answer-placed');
}

function clearAnswers() {
  if (currentMode === 'trace') { restartTrace(); return; }
  answers = new Array(answers.length).fill('');
  const blanksEls = document.querySelectorAll('.letter-box.blank');
  blanksEls.forEach(b=>{ b.textContent=''; b.classList.remove('answer-placed'); });
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('used','selected'));
  document.getElementById('checkBtn').disabled = true;
}

// ---- CHECK ----
function checkAnswer() {
  if (currentMode === 'trace') return;
  const word = currentData.word;
  let correct = false;

  if(currentMode === 'letter') {
    correct = blankIdxs.every((pos,i) => answers[i] === word[pos]);
  } else if(currentMode === 'syllable') {
    const sylls = SYLLABLE_MAP[word] || splitSyllablesFallback(word);
    correct = answers[0] === sylls[blankIdxs[0]];
  } else {
    // build: reconstruct and check
    const sylls = SYLLABLE_MAP[word] || splitSyllablesFallback(word);
    correct = answers.join('') === sylls.join('');
  }

  if(correct) {
    onCorrect();
  } else {
    onWrong();
  }
}

function onCorrect() {
  // Flash correct
  document.querySelectorAll('.letter-box.blank').forEach(b=>{
    b.classList.add('correct-flash');
  });

  const pts = awardCorrect(phasePts());
  spawnParticles(true);
  playChime(true);
  vibrateFeedback([30]);

  setTimeout(() => speak(currentData.word, { rate: 0.8 }), 350);
  setTimeout(()=>{
    showFeedback(true, pts);
  }, 400);
}

function onWrong() {
  loseLife();
  playChime(false);
  vibrateFeedback([50,40,50]);

  // Flash red on blank boxes
  document.querySelectorAll('.letter-box.blank').forEach(b => b.classList.add('wrong-flash'));
  const card = document.getElementById('questionCard');
  card.classList.add('shake');
  setTimeout(() => {
    card.classList.remove('shake');
    document.querySelectorAll('.letter-box.blank').forEach(b => b.classList.remove('wrong-flash'));
  }, 500);

  // Always show feedback popup (not silent)
  setTimeout(() => {
    showFeedback(false, 0, lives <= 0);
  }, 500);
}

function updateLives() {
  const el = document.getElementById('livesDisplay');
  const pr = P();
  el.textContent = (pr && pr.noLives) ? '💖 ∞' : '❤️'.repeat(Math.max(0,lives)) + '🖤'.repeat(Math.max(0,3-lives));
}

// ---- FEEDBACK ----
function showFeedback(correct, pts, gameOver=false) {
  const emoji = correct
    ? EMOJIS_CORRECT[Math.floor(Math.random()*EMOJIS_CORRECT.length)]
    : (gameOver ? '😔' : EMOJIS_WRONG[Math.floor(Math.random()*EMOJIS_WRONG.length)]);
  const msg = correct
    ? MSGS_CORRECT[Math.floor(Math.random()*MSGS_CORRECT.length)]
    : (gameOver ? 'Acabaram as vidas!' : MSGS_WRONG[Math.floor(Math.random()*MSGS_WRONG.length)]);

  document.getElementById('feedbackEmoji').textContent = emoji;
  const titleEl = document.getElementById('feedbackTitle');
  titleEl.textContent = correct ? 'Acertou! 🎉' : (gameOver ? 'Fim de jogo!' : 'Quase!');
  titleEl.className = 'feedback-title '+(correct?'win':'lose');
  document.getElementById('feedbackSub').textContent = correct ? `+${pts} pontos! ${msg}` : msg;

  const starsEl = document.getElementById('feedbackStars');
  starsEl.textContent = correct ? '⭐'.repeat(Math.max(1,Math.min(3,currentPhase))) : '';

  const nextBtn = document.querySelector('#feedback .btn-check');
  if(gameOver) {
    nextBtn.textContent = '🏠 Ver resultado';
    nextBtn.onclick = () => { showScreen('game'); showResult(); };
  } else if(correct) {
    nextBtn.textContent = 'Próxima →';
    nextBtn.onclick = nextQuestion;
  } else {
    nextBtn.textContent = '↩ Tentar de novo';
    nextBtn.onclick = () => { clearAnswers(); showScreen('game'); };
  }
  showScreen('feedback');
}

function nextQuestion() {
  clearAnswers();
  currentQ++;
  showScreen('game');
  loadQuestion();
}

// ---- RESULT ----
function showResult() {
  const pr = P();
  if(pr && score > (pr.best||0)) pr.best = score;

  const pct = Math.min(1, gameCorrect / PHASES[currentPhase].questions) * (gameErrors===0 ? 1 : gameErrors<=2 ? 0.85 : 0.55);
  const starsN = pct >= 0.8 ? 3 : pct >= 0.5 ? 2 : 1;
  const stars = '⭐'.repeat(starsN);
  const emoji = pct >= 0.8 ? '🏆' : pct >= 0.5 ? '🎉' : '💪';
  const title = pct >= 0.8 ? 'Incrível!' : pct >= 0.5 ? 'Muito bem!' : 'Continue tentando!';

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = `Você fez ${score} pontos!`;
  document.getElementById('resultStars').textContent = stars;

  finishGame(starsN);
  spawnConfetti();
  showScreen('result');
  updateBestScore();
}

function goHome() {
  stopTrace();
  showScreen('home');
  renderHome();
}

// ---- PARTICLES ----
function spawnParticles(correct) {
  const emojis = correct ? ['⭐','✨','💫','🌟'] : ['💧','😅'];
  for(let i=0;i<6;i++){

    p.style.animationDelay = Math.random()*0.4+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1500);

}

function spawnConfetti() {
  const colors = ['#FF6B6B','#FFE66D','#4ECDC4','#A855F7','#60A5FA','#4ADE80','#FB923C'];
  for(let i=0;i<30;i++){

// ---- SCREEN MANAGEMENT ----
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.toggle('hidden', s.id !== id);
  });
}

// ---- UTILS ----
function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function confirmExit() {

}
function closeExit() {
  document.getElementById('exitConfirm').classList.remove('visible');
}
function doExit() {
  document.getElementById('exitConfirm').classList.remove('visible');
  goHome();
}

const STORE_KEY = 'letrinha_v2';
const AVATARS = ['🦊','🐯','🐼','🦄','🐸','🐙','🦁','🐰','🐵','🦋','🐬','🐲'];
let combo = 0, gameErrors = 0, gameCorrect = 0, gameMaxCombo = 0, qWrong = false, learnedBefore = 0;

function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function loadDB() {
  try {
    const j = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (j && Array.isArray(j.profiles)) {
      j.profiles = j.profiles.filter(p => p && typeof p.id === 'string').slice(0, 6).map(fixProfile);
      if (!j.profiles.some(p => p.id === j.cur)) j.cur = j.profiles[0] ? j.profiles[0].id : null;
      return j;
    }
  } catch (e) {}
  let legacy = 0;
  try { legacy = parseInt(localStorage.getItem('letrinha_best') || '0') || 0; } catch (e) {}
  return { profiles: [], cur: null, legacyBest: legacy };
}
function fixProfile(p) {
  p.name = String(p.name || 'Jogador').slice(0, 12);
  p.av = AVATARS.includes(p.av) ? p.av : '🙂';
  if (!p.stats || typeof p.stats !== 'object') p.stats = {};
  if (!p.stars || typeof p.stars !== 'object') p.stars = {};
  if (!Array.isArray(p.stickers)) p.stickers = [];
  if (!Array.isArray(p.days)) p.days = [];
  ['streak','games','best','listenOk','initOk','engOk','traceOk','perfect','maxCombo'].forEach(k => { p[k] = Number(p[k]) || 0; });
  p.lastDay = String(p.lastDay || '');
  p.noLives = !!p.noLives;
  return p;
}
let DB = loadDB();
function saveDB() { try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) {} }
function P() { return DB.profiles.find(p => p.id === DB.cur) || null; }

function newProfile(name, av) {
  const p = fixProfile({ id: 'p' + Date.now().toString(36) + Math.floor(Math.random()*999), name: name || 'Jogador', av, best: DB.legacyBest || 0 });
  DB.legacyBest = 0;
  DB.profiles.push(p);
  DB.cur = p.id;
  saveDB();
  return p;
}

function skey(d, phase) { return (phase === 4 ? 'EN:' : phase === 0 ? 'LT:' : '') + d.word; }
function phasePts() { return currentPhase <= 1 ? 5 : 5 + (currentPhase - 1) * 3; }
function rec(d, ok) {
  const p = P(); if (!p) return;
  const k = skey(d, currentPhase);
  const st = p.stats[k] || (p.stats[k] = { ok: 0, err: 0, last: 0 });
  if (ok) st.ok++; else st.err++;
  st.last = Date.now();
}
function learnedCount(p) { return p ? Object.entries(p.stats).filter(([k, s]) => !k.startsWith('LT:') && s.ok >= 2 && s.ok >= s.err).length : 0; }
function lettersCount(p) { return p ? Object.entries(p.stats).filter(([k, s]) => k.startsWith('LT:') && s.ok >= 2 && s.ok >= s.err).length : 0; }

// Escolha ponderada: palavras novas e as que a criança erra aparecem mais; as dominadas, menos.
function weightedPick(words, n) {
  const p = P();
  const scored = words.map(w => {
    const st = p && p.stats[skey(w, currentPhase)];
    let wt = 2;
    if (!st && w.easy) wt = 4;
    if (st) {
      if (st.ok >= 3 && st.err === 0) wt = 0.35;
      else if (st.ok >= st.err * 2 + 2) wt = 0.6;
      else wt = 1 + Math.min(4, st.err * 1.5);
    }
    return { w, k: Math.pow(Math.random(), 1 / wt) };
  });
  return scored.sort((a, b) => b.k - a.k).slice(0, n).map(x => x.w);
}

function awardCorrect(base) {
  combo++; gameCorrect++;
  if (combo > gameMaxCombo) gameMaxCombo = combo;
  const bonus = combo >= 3 ? Math.min(3, combo - 2) : 0;
  score += base + bonus;
  if (!qWrong) rec(currentData, true);
  if (combo >= 3) comboToast(combo);
  return base + bonus;
}
function loseLife() {
  combo = 0; gameErrors++;
  if (!qWrong) { qWrong = true; rec(currentData, false); }
  const pr = P();
  if (!(pr && pr.noLives)) lives--;
  updateLives();
}
function comboToast(n) {
  const t = document.createElement('div');
  t.className = 'combo-toast';
  t.textContent = `🔥 Combo ${n}!`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1200);
}

function todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function touchDay() {
  const p = P(); if (!p) return;
  const today = todayStr();
  if (p.lastDay === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  p.streak = (p.lastDay === todayStr(y)) ? p.streak + 1 : 1;
  p.lastDay = today;
  p.days.push(today);
  if (p.days.length > 400) p.days = p.days.slice(-400);
  saveDB();
}

function finishGame(starsN) {
  const p = P();
  const ex = document.getElementById('resultExtra');
  if (!p) { if (ex) ex.innerHTML = ''; return; }
  p.games++;
  if (!p.stars[currentPhase] || p.stars[currentPhase] < starsN) p.stars[currentPhase] = starsN;
  if (gameMaxCombo > p.maxCombo) p.maxCombo = gameMaxCombo;
  const completed = currentQ >= PHASES[currentPhase].questions;
  if (completed && gameErrors === 0) p.perfect++;
  const got = [];
  STICKERS.forEach(st => { if (!p.stickers.includes(st.id) && st.ok(p)) { p.stickers.push(st.id); got.push(st); } });
  saveDB();
  const learnedNow = learnedCount(p) - learnedBefore;
  let h = '';
  if (learnedNow > 0) h += `<div>🧠 ${learnedNow} ${learnedNow === 1 ? 'palavra nova aprendida' : 'palavras novas aprendidas'}!</div>`;
  if (p.streak >= 2) h += `<div>🔥 ${p.streak} dias seguidos!</div>`;
  if (got.length) {
    h += `<div>🎖️ ${got.length === 1 ? 'Figurinha nova' : 'Figurinhas novas'}!</div><div class="chips">` +
         got.map(g => `<div class="stk new" style="min-width:96px"><span class="e newstk" style="font-size:42px">${g.e}</span><b>${esc(g.n)}</b></div>`).join('') + '</div>';
    setTimeout(playFanfare, 350);
  } else {
    setTimeout(playFanfare, 200);
  }
  if (ex) ex.innerHTML = h;
  speak(starsN === 3 ? `Parabéns, ${p.name}!` : `Muito bem, ${p.name}!`, { rate: 0.9 });
}

function playFanfare() {
  if (!soundOn) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => {
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t = now + i * 0.13;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.start(t); o.stop(t + 0.32);
    } catch (e) {}
  });
}

const TR = { raf: 0, cv: null, ctx: null, strokes: [], dens: [], idx: 0, cur: [], drawing: false, fails: 0, done: false, t0: 0, size: 300, dpr: 1, user: false };

function densify(poly, step) {
  const out = [];
  for (let i = 0; i < poly.length - 1; i++) {
    const [x1, y1] = poly[i], [x2, y2] = poly[i + 1];
    const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
    for (let k = 0; k < n; k++) out.push([x1 + (x2 - x1) * k / n, y1 + (y2 - y1) * k / n]);
  }
  out.push(poly[poly.length - 1]);
  return out;
}
function stopTrace() { if (TR.raf) cancelAnimationFrame(TR.raf); TR.raf = 0; TR.done = true; }

function buildTraceMode() {
  document.getElementById('wordDisplay').innerHTML = '';
  document.getElementById('questionCard').classList.add('compact');
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('questionLabel').textContent = `Letra ${currentData.word}: siga o caminho`;
  const grid = document.getElementById('optionsGrid');
  grid.className = 'trace-wrap';
  grid.innerHTML = '<canvas id="traceCv" aria-label="Área para escrever a letra"></canvas><div class="trace-hint" id="traceHint">Siga a bolinha verde com o dedo!</div>';
  const cv = document.getElementById('traceCv');
  TR.cv = cv; TR.strokes = STROKES[currentData.word] || [[[50,10],[50,90]]];
  TR.dens = TR.strokes.map(st => densify(st, 2));
  TR.idx = 0; TR.cur = []; TR.drawing = false; TR.fails = 0; TR.done = false; TR.user = false; TR.t0 = performance.now();
  sizeTrace();
  cv.onpointerdown = trDown; cv.onpointermove = trMove; cv.onpointerup = trUp; cv.onpointercancel = trUp;
  if (TR.raf) cancelAnimationFrame(TR.raf);
  const loop = () => { if (TR.done) return; trDraw(); TR.raf = requestAnimationFrame(loop); };
  TR.raf = requestAnimationFrame(loop);
}
function sizeTrace() {
  const cv = TR.cv; if (!cv) return;
  const r = cv.getBoundingClientRect();
  TR.dpr = Math.min(2, window.devicePixelRatio || 1);
  TR.size = Math.max(120, Math.round(r.width || 300));
  cv.width = cv.height = Math.round(TR.size * TR.dpr);
  TR.ctx = cv.getContext('2d');
}
function restartTrace() {
  if (!TR.cv) return;
  TR.idx = 0; TR.cur = []; TR.drawing = false; TR.fails = 0; TR.user = false; TR.t0 = performance.now();
  TR.cv.classList.remove('ok', 'bad');
  const h = document.getElementById('traceHint'); if (h) h.textContent = 'Vamos de novo! Siga a bolinha verde.';
}
function trPt(e) {
  const r = TR.cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100];
}
function trDown(e) {
  if (TR.done || TR.idx >= TR.strokes.length) return;
  e.preventDefault();
  try { TR.cv.setPointerCapture(e.pointerId); } catch (x) {}
  TR.drawing = true; TR.user = true; TR.cur = [trPt(e)];
  primeAudio();
}
function trMove(e) { if (!TR.drawing) return; e.preventDefault(); TR.cur.push(trPt(e)); }
function trUp(e) {
  if (!TR.drawing) return;
  TR.drawing = false;
  const pts = TR.cur; TR.cur = [];
  if (pts.length < 2) return;
  // pontos do dedo, interpolados
  const user = []; for (let i = 0; i < pts.length - 1; i++) user.push(...densify([pts[i], pts[i + 1]], 2));
  user.push(pts[pts.length - 1]);
  const guide = TR.dens[TR.idx];
  const R = 12;
  const near = (a, list, r) => list.some(b => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 <= r * r);
  const cover = guide.filter(g => near(g, user, R)).length / guide.length;
  const stray = user.filter(u => !near(u, guide, 18)).length / user.length;
  const startOk = Math.hypot(user[0][0] - guide[0][0], user[0][1] - guide[0][1]) <= 22;
  const relaxed = TR.fails >= 2;
  const good = cover >= (relaxed ? 0.65 : 0.8) && stray <= (relaxed ? 0.45 : 0.3) && (startOk || relaxed);
  const hint = document.getElementById('traceHint');
  if (good) {
    TR.idx++; TR.fails = 0; TR.t0 = performance.now();
    playChime(true);
    if (TR.idx >= TR.strokes.length) { traceSuccess(); }
    else if (hint) hint.textContent = 'Muito bem! Agora o próximo traço.';
  } else {
    TR.fails++; traceFailCount();
    TR.cv.classList.remove('bad'); void TR.cv.offsetWidth; TR.cv.classList.add('bad');
    playChime(false);
    if (hint) hint.textContent = !startOk && !relaxed ? 'Comece na bolinha verde!' : cover < 0.8 ? 'Cubra todo o tracejado!' : 'Fique em cima do tracejado!';
    if (TR.fails === 1 && !startOk && !relaxed) { /* só orienta */ }
    TR.t0 = performance.now();
  }
}
function traceSuccess() {
  TR.done = true;
  TR.cv.classList.add('ok');
  trDraw(true);
  const pts = awardCorrect(phasePts());
  const pr = P(); if (pr) pr.traceOk++;
  spawnParticles(true); vibrateFeedback([30]);
  setTimeout(() => speak(currentData.ex, { rate: 0.8 }), 300);
  setTimeout(() => showFeedback(true, pts), 1500);
}
function traceFailCount() { combo = 0; gameErrors++; if (!qWrong) { qWrong = true; rec(currentData, false); } }

function trDraw(finished) {
  const ctx = TR.ctx; if (!ctx || !TR.cv) return;
  if (document.getElementById('game').classList.contains('hidden') && !finished) return;
  const S = TR.size * TR.dpr, k = S / 100;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, S, S);
  // pauta
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.2 * TR.dpr; ctx.setLineDash([6 * TR.dpr, 6 * TR.dpr]);
  [10, 50, 90].forEach(y => { ctx.beginPath(); ctx.moveTo(4 * k, y * k); ctx.lineTo(96 * k, y * k); ctx.stroke(); });
  ctx.setLineDash([]);
  const path = (poly) => { ctx.beginPath(); poly.forEach(([x, y], i) => i ? ctx.lineTo(x * k, y * k) : ctx.moveTo(x * k, y * k)); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  TR.strokes.forEach((st, i) => {
    const done = i < TR.idx;
    path(st); ctx.strokeStyle = done ? 'rgba(74,222,128,.9)' : 'rgba(255,255,255,.2)'; ctx.lineWidth = (done ? 8 : 12) * k; ctx.stroke();
    if (!done) { path(st); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.2 * k; ctx.setLineDash([2.2 * k, 3 * k]); ctx.stroke(); ctx.setLineDash([]); }
  });
  if (finished || TR.idx >= TR.strokes.length) return;
  const st = TR.strokes[TR.idx], d = TR.dens[TR.idx];
  // bolinha de início numerada
  const pulse = 1 + 0.18 * Math.sin((performance.now() - TR.t0) / 180);
  ctx.beginPath(); ctx.arc(st[0][0] * k, st[0][1] * k, 6.5 * k * pulse, 0, 7); ctx.fillStyle = '#4ADE80'; ctx.fill();
  ctx.lineWidth = 1.5 * k; ctx.strokeStyle = '#fff'; ctx.stroke();
  if (TR.strokes.length > 1) { ctx.fillStyle = '#1E1B4B'; ctx.font = `900 ${7 * k}px Nunito, Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(TR.idx + 1), st[0][0] * k, st[0][1] * k + 0.4 * k); }
  // mãozinha demonstra o sentido (aparece se a criança ainda não começou ou está errando)
  const idle = (performance.now() - TR.t0) > 1200 && !TR.drawing;
  if (idle) {
    const dur = Math.max(1400, d.length * 28), t = ((performance.now() - TR.t0 - 1200) % (dur + 700));
    const f = Math.min(1, t / dur), j = Math.min(d.length - 1, Math.floor(f * (d.length - 1)));
    const [px, py] = d[j];
    ctx.font = `${12 * k}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('👆', px * k + 3 * k, py * k + 6 * k);
    ctx.beginPath(); ctx.arc(px * k, py * k, 3 * k, 0, 7); ctx.fillStyle = 'rgba(255,230,109,.95)'; ctx.fill();
  }
  // traço do dedo
  if (TR.cur.length > 1) { path(TR.cur); ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 7 * k; ctx.stroke(); }
}
window.addEventListener('resize', () => { if (TR.cv && TR.cv.isConnected) sizeTrace(); });

let parentAnswer = 0;
function openParents() {
  const a = 4 + Math.floor(Math.random() * 6), b = 4 + Math.floor(Math.random() * 6);
  parentAnswer = a + b;
  openOv(`<h2>👨‍👩‍👧 Área dos adultos</h2><p class="sub">Para entrar, responda: quanto é <b>${a} + ${b}</b>?</p>
    <input class="ov-input" id="pgAns" inputmode="numeric" maxlength="3" placeholder="?" autocomplete="off">
    <div id="pgMsg" class="sub" style="min-height:20px"></div>
    <button class="ov-btn" data-act="pgok">Entrar</button><button class="ov-btn ghost" data-act="close">Voltar</button>`);
  setTimeout(() => { const i = document.getElementById('pgAns'); if (i) i.focus(); }, 80);
}
function renderParents() {
  if (!DB.profiles.length) return openOv(`<h2>👨‍👩‍👧 Área dos adultos</h2><p class="sub">Ainda não há jogadores.</p><button class="ov-btn" data-act="close">Fechar</button>`);
  const cards = DB.profiles.map(p => {
    let ok = 0, err = 0;
    Object.values(p.stats).forEach(s => { ok += s.ok; err += s.err; });
    const acc = ok + err ? Math.round(ok * 100 / (ok + err)) : 0;
    const hard = Object.entries(p.stats).filter(([, s]) => s.err > 0).sort((a, b) => (b[1].err - b[1].ok * 0.5) - (a[1].err - a[1].ok * 0.5)).slice(0, 8)
      .map(([k]) => `<i>${esc(k.replace('EN:', ''))}${k.startsWith('EN:') ? ' (EN)' : ''}</i>`).join('') || 'Nenhuma ainda.';
    const phases = [0, 1, 2, 3, 4].map(n => `Fase ${n}: ${'⭐'.repeat(p.stars[n] || 0) || '-'}`).join(' · ') + ` · Letras escritas: ${lettersCount(p)}/26`;
    const days = new Set(p.days).size;
    return `<div class="pn-card"><h3><span>${p.av}</span>${esc(p.name)}</h3>
      <div class="pn-grid"><div><b>${p.games}</b><span>jogos</span></div><div><b>${learnedCount(p)}</b><span>palavras aprendidas</span></div><div><b>${acc}%</b><span>acertos</span></div>
      <div><b>${days}</b><span>dias jogados</span></div><div><b>${p.streak}</b><span>dias seguidos</span></div><div><b>${p.stickers.length}</b><span>figurinhas</span></div></div>
      <div class="pn-train">${phases}</div>
      <div class="pn-train"><b>Para treinar:</b> ${hard}</div>
      <label class="pn-opt"><input type="checkbox" data-nolives="${esc(p.id)}" ${p.noLives ? 'checked' : ''}> Modo tranquilo (sem perder vidas)</label>
      <div class="pn-acts"><button class="ov-btn ghost" data-reset="${esc(p.id)}">Zerar progresso</button><button class="ov-btn danger" data-del="${esc(p.id)}">Remover jogador</button></div></div>`;
  }).join('');
  openOv(`<h2>👨‍👩‍👧 Área dos adultos</h2><p class="sub">Os dados ficam somente neste aparelho. Nada é enviado nem coletado.</p>${cards}<button class="ov-btn" data-act="close">Fechar</button>`);
}

const armed = {};
document.getElementById('ov').addEventListener('click', e => {
  const t = e.target.closest('button,input'); if (!t) return;
  const d = t.dataset;
  if (d.pick) { DB.cur = d.pick; saveDB(); window.__phaseAuto = true; renderHome(true); closeOv(); return; }
  if (d.av) { newAv = d.av; document.querySelectorAll('.av-opt').forEach(b => b.classList.toggle('sel', b.dataset.av === newAv)); return; }
  if (d.nolives) { const p = DB.profiles.find(x => x.id === d.nolives); if (p) { p.noLives = t.checked; saveDB(); } return; }
  if (d.reset || d.del) {
    const id = d.reset || d.del, k = (d.reset ? 'r' : 'd') + id;
    if (!armed[k]) { armed[k] = true; t.textContent = 'Tem certeza? Toque de novo'; setTimeout(() => { armed[k] = false; if (t.isConnected) t.textContent = d.reset ? 'Zerar progresso' : 'Remover jogador'; }, 4000); return; }
    armed[k] = false;
    const i = DB.profiles.findIndex(x => x.id === id); if (i < 0) return;
    if (d.reset) { const p = DB.profiles[i]; Object.assign(p, fixProfile({ id: p.id, name: p.name, av: p.av, noLives: p.noLives })); }
    else { DB.profiles.splice(i, 1); if (DB.cur === id) DB.cur = DB.profiles[0] ? DB.profiles[0].id : null; }
    saveDB(); window.__phaseAuto = true; renderHome(true);
    if (!DB.profiles.length) return openNewProfile();
    return renderParents();
  }
  switch (d.act) {
    case 'close': closeOv(); break;
    case 'new': openNewProfile(); break;
    case 'back': openProfiles(); break;
    case 'create': {
      const nm = (document.getElementById('npName').value || '').trim();
      if (!nm) { document.getElementById('npName').focus(); return; }
      newProfile(nm, newAv); window.__phaseAuto = true; renderHome(true); closeOv(); break;
    }
    case 'pgok': {
      const v = parseInt(document.getElementById('pgAns').value, 10);
      if (v === parentAnswer) renderParents();
      else { document.getElementById('pgMsg').textContent = 'Resposta errada. Tente de novo.'; document.getElementById('pgAns').value = ''; }
      break;
    }
  }
});
document.getElementById('ov').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'npName') document.querySelector('[data-act="create"]').click();
  if (e.target.id === 'pgAns') document.querySelector('[data-act="pgok"]').click();
});


// Init
init();
</script>
</body>
</html>
